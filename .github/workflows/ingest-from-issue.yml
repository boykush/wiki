name: Ingest from Issue
on:
  issues:
    types: [labeled]

jobs:
  create-scrap:
    if: github.event.label.name == 'ingest' && github.event.issue.user.login == 'boykush'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: false

      - name: Setup Scraps
        uses: boykush/scraps@b8da11e2943a9c20bbc444a3061aab5ce7dbb752 # v1.1.0

      - name: Run Claude with ingest skill
        env:
          SCRAPS_DIRECTORY: scraps
        uses: anthropics/claude-code-action@239e3a730883eeb5c53db12b0fc9573b3024b126 # v1.0.191
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          settings: ".claude/settings.json"
          claude_args: --model claude-opus-4-7 --allowed-tools "WebFetch,Read,Write,Edit,Glob,Bash,Skill"
          prompt: |
            /ingest --headless ${{ github.event.issue.title }}

            追加情報:
            ${{ github.event.issue.body }}

      - name: Create Pull Request
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git"

          BRANCH_NAME="add-scrap/issue-${ISSUE_NUMBER}-${{ github.run_id }}"
          git checkout -b "$BRANCH_NAME"

          git add scraps/
          if git diff --cached --quiet; then
            echo "No changes to commit (ingest may have skipped)"
            exit 0
          fi
          git commit -m "Add scrap: ${ISSUE_TITLE}"
          git push origin "$BRANCH_NAME"

          gh pr create \
            --title "Add scrap: ${ISSUE_TITLE}" \
            --body "Closes #${ISSUE_NUMBER}" \
            --base main
