name: RSS to Scrap PR

on:
  schedule:
    - cron: '0 0 * * *'  # 09:00 JST daily (target = previous JST day)
  workflow_dispatch:
    inputs:
      date:
        description: 'Target date (YYYY-MM-DD, JST). Default: yesterday.'
        required: false

permissions: {}

jobs:
  list-articles:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read # checkout
    outputs:
      articles: ${{ steps.fetch.outputs.articles }}
      count: ${{ steps.fetch.outputs.count }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0

      - id: fetch
        env:
          DATE_INPUT: ${{ inputs.date }}
        run: |
          if [ -n "$DATE_INPUT" ]; then
            ARTICLES=$(mise run fetch-rss -- --date "$DATE_INPUT")
          else
            ARTICLES=$(mise run fetch-rss)
          fi
          {
            echo "articles<<RSSEOF"
            echo "$ARTICLES"
            echo "RSSEOF"
          } >> "$GITHUB_OUTPUT"
          echo "count=$(echo "$ARTICLES" | jq 'length')" >> "$GITHUB_OUTPUT"

  create-scrap:
    needs: list-articles
    if: needs.list-articles.outputs.count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        article: ${{ fromJson(needs.list-articles.outputs.articles) }}
    permissions:
      contents: write # push the branch
      pull-requests: write # open the PR
      id-token: write # claude-code-action OIDC
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0

      - name: Setup Scraps
        uses: boykush/scraps@9a27d25911b62ce6f03851e6809764327774a185 # v1.2.0

      # digest は自分でも本文を取りに行くが、全文は数万字になりうる。
      # ファイルに落として Read させたほうが取りこぼしが無い。
      - name: Fetch article body
        env:
          ARTICLE_URL: ${{ matrix.article.url }}
        run: |
          mise run fetch-article-body -- --url "$ARTICLE_URL" > article-body.md
          echo "fetched $(wc -c < article-body.md) bytes"

      - name: Run Claude with digest skill
        uses: anthropics/claude-code-action@1f291e1cfe0f5fc21db2aef19af844591600ade7 # v1.0.206
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          settings: ".claude/settings.json"
          # Grep / Glob を渡さないことで、ウィキの照会が scraps CLI に限られる
          claude_args: --allowed-tools "WebFetch,Read,Write,Edit,Bash,Skill"
          prompt: |
            /digest ${{ matrix.article.url }}

            記事本文は取得済みで、作業ディレクトリの `article-body.md` にある。まず Read で
            全文を読み、これを情報源とすること。空または極端に短い場合のみ WebFetch で取り直す。

            digest の適用範囲外（主題が資料ではなく対象になるURL）と判断したら、対話相手が
            いないため ingest へ回せない。何も書かずに理由を述べて終える。

      - name: Create Pull Request
        env:
          ARTICLE_TITLE: ${{ matrix.article.title }}
          ARTICLE_URL: ${{ matrix.article.url }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${REPOSITORY}.git"

          URL_HASH=$(printf '%s' "$ARTICLE_URL" | sha1sum | cut -c1-8)
          BRANCH_NAME="add-scrap/rss-${URL_HASH}-${RUN_ID}"
          git checkout -b "$BRANCH_NAME"

          git add scraps/
          if git diff --cached --quiet; then
            echo "No changes to commit (digest may have skipped this URL)"
            exit 0
          fi
          git commit -m "Add scrap from RSS: ${ARTICLE_TITLE}"
          git push origin "$BRANCH_NAME"

          gh pr create \
            --title "Add scrap from RSS: ${ARTICLE_TITLE}" \
            --body "Source: ${ARTICLE_URL}" \
            --base main \
            --reviewer boykush
