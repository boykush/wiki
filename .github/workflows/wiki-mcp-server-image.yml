name: Build and push wiki-mcp-server image

# The image bundles the wiki content, so any push to main rebuilds it. mise.toml is
# in the filter because it pins the scraps version that goes into the image.
on:
  push:
    branches:
      - main
    paths:
      - "scraps/**"
      - "Dockerfile"
      - ".dockerignore"
      - "mise.toml"
      - ".github/workflows/wiki-mcp-server-image.yml"
  pull_request:
    branches:
      - main
    # Content changes cannot break the build, so PRs only rebuild on image inputs.
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "mise.toml"
      - ".github/workflows/wiki-mcp-server-image.yml"
  workflow_dispatch:

permissions:
  contents: read

# Newest content wins; an older run still in flight would publish a stale `main`.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/boykush/wiki-mcp-server

jobs:
  image:
    name: Build image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write # push to GHCR
      attestations: write # store the provenance
      id-token: write # sign the provenance
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve tag
        id: meta
        run: |
          scraps_version=$(sed -n 's/^"github:boykush\/scraps" *= *"\(.*\)"$/\1/p' mise.toml)
          : "${scraps_version:?scraps version not found in mise.toml}"
          {
            echo "scraps_version=${scraps_version}"
            echo "tag=${scraps_version}-${GITHUB_SHA:0:7}"
          } >> "$GITHUB_OUTPUT"

      - name: Build
        env:
          SCRAPS_VERSION: ${{ steps.meta.outputs.scraps_version }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          docker build \
            --platform linux/amd64 \
            --build-arg "SCRAPS_VERSION=${SCRAPS_VERSION}" \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --label "org.opencontainers.image.version=${TAG}" \
            --tag "${IMAGE}:${TAG}" \
            --tag "${IMAGE}:main" \
            .

      # A tool call proves both halves of the image: the binary serves, and the wiki
      # content it answers from is really baked in. The second run covers the listen
      # address override, which is the image's only argument.
      - name: Smoke test
        env:
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          trap 'docker rm --force wiki-mcp-server >/dev/null 2>&1 || true' EXIT
          probe() {
            for _ in $(seq 1 30); do
              if curl -fsS -X POST "http://127.0.0.1:$1/mcp" \
                   -H 'Content-Type: application/json' \
                   -H 'Accept: application/json, text/event-stream' \
                   -d '{"jsonrpc":"2.0","id":1,"method":"tools/call","params":{"name":"search_scraps","arguments":{"query":"Kubernetes"}}}' \
                   | grep -q '"result"'; then
                return 0
              fi
              sleep 1
            done
            docker logs wiki-mcp-server >&2 || true
            return 1
          }

          docker run --rm --detach --name wiki-mcp-server -p 1113:1113 "${IMAGE}:${TAG}"
          probe 1113 || { echo "default address did not answer" >&2; exit 1; }
          docker rm --force wiki-mcp-server > /dev/null

          docker run --rm --detach --name wiki-mcp-server -p 18080:18080 "${IMAGE}:${TAG}" 0.0.0.0:18080
          probe 18080 || { echo "overridden address did not answer" >&2; exit 1; }
          echo "MCP server answered from the baked-in wiki on both addresses"

      - name: Set up trivy
        uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          install_args: trivy

      # Scanned before the push, so a build carrying a fixable HIGH or CRITICAL never
      # reaches GHCR. --ignore-unfixed leaves out what no upgrade can fix yet.
      - name: Scan image
        env:
          TAG: ${{ steps.meta.outputs.tag }}
        run: trivy image --no-progress --ignore-unfixed --severity HIGH,CRITICAL --exit-code 1 "${IMAGE}:${TAG}"

      - name: Log in to GHCR
        if: github.ref == 'refs/heads/main'
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin

      # `main` is the mutable pointer for whatever tracks the newest build; the
      # version-and-commit tag identifies a build after the fact.
      - name: Push
        id: push
        if: github.ref == 'refs/heads/main'
        env:
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          docker push "${IMAGE}:${TAG}"
          docker push "${IMAGE}:main"
          digest=$(docker inspect --format '{{index .RepoDigests 0}}' "${IMAGE}:main")
          echo "digest=${digest#*@}" >> "$GITHUB_OUTPUT"

      # A signed statement, stored next to the image in GHCR, that this digest was built
      # by this workflow from this commit. Check it with
      # `gh attestation verify oci://ghcr.io/boykush/wiki-mcp-server:main --owner boykush`.
      - name: Attest
        if: github.ref == 'refs/heads/main'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
          # Storage records exist for organization-owned repos only.
          create-storage-record: false
