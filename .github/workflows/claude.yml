name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [assigned]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && github.event.action == 'assigned' && github.event.assignee.login == 'claude[bot]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Scraps
        uses: boykush/scraps@9a627afc4d09daa8d1daf40b14fda62ecbc27aa7 # v3.0

      # Reads the token from Parameter Store with this run's own OIDC identity,
      # so this repository holds no Claude credential of its own. Re-pin to a
      # main SHA once boykush/infrastructure-as-code#35 is merged.
      - name: Fetch the Claude Code token
        id: claude-token
        uses: boykush/infrastructure-as-code/.github/actions/claude-code-token@bba756b6d51d7d0c28c2add66f2e3d15524b771e

      - name: Run Claude Code
        uses: anthropics/claude-code-action@cfc3eb22bfed5c26ef66e3223c982af27e4524de # v1.0.231
        with:
          claude_code_oauth_token: ${{ steps.claude-token.outputs.token }}
          settings: ".claude/settings.json"
          claude_args: --allowed-tools "WebFetch,Read,Write,Edit,Glob,Bash,Skill"
