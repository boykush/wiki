# This repository's entities in boykush's Backstage catalog, found on main by its
# GitHub discovery (boykush/infrastructure-as-code's applications/backstage/).
# How an entity is written — which edges to draw, what a tag means — is set in
# boykush/github-management's AGENTS.md and the comments atop its catalog/ files.
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: wiki
  description: >-
    Scraps で書く個人の知識 wiki。GitHub Pages で公開し、MCP でも配る。dotfiles が user
    scope に接続を置くので、このマシンの全セッションから引ける
  annotations:
    backstage.io/kubernetes-label-selector: app.kubernetes.io/part-of=wiki
  links:
    - url: https://boykush.github.io/wiki/
      title: 公開サイト
      icon: docs
spec:
  type: repository
  lifecycle: production
  owner: user:boykush
  system: knowledge
  providesApis:
    - wiki-mcp
  consumesApis:
    - adr-mcp
    - catalog-mcp
  dependsOn:
    - component:scraps
    - component:ai-plugins
    - component:workflows
    - resource:doks-cluster
    - resource:cloudflare-tunnel
    - resource:ghcr
    - resource:github-pages
---
apiVersion: backstage.io/v1alpha1
kind: API
metadata:
  name: wiki-mcp
  description: >-
    boykush/wiki（Scraps wiki）を検索・参照する remote MCP サーバー。読み取り専用・無認証。公開エンドポイントは
    infrastructure-as-code が持つ
  links:
    - url: https://github.com/boykush/ai-plugins/blob/main/plugins/wiki-remote-mcp/apm.yml
      title: 接続先の持ち主（ai-plugins）
      icon: github
spec:
  type: mcp-server
  lifecycle: production
  owner: user:boykush
  system: knowledge
  remotes:
    - type: streamable-http
      url: https://wiki-mcp.boykush.com/mcp
